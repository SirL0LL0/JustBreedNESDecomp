# ld65 linker configuration â€” Just Breed (MMC5, PRG mode 3)
# PRG mode 3: $8000/$A000/$C000 switchable, $E000 fixed = bank $1F.

MEMORY {
    HEADER:  start = $00,   size = $10, file = %O, fill = yes;
    PRGLOW:  start = $8000, size = $4000, fill = yes;   ; switchable bank window
    PRGHIGH: start = $C000, size = $4000, fill = yes;   ; fixed bank $1F
}

SEGMENTS {
    HEADER:   load = HEADER,  type = ro;
    CODE0:    load = PRGLOW,  type = ro,  start = $8000;
    CODE31:   load = PRGHIGH, type = ro,  start = $C000;
    VECTORS:  load = PRGHIGH, type = ro,  start = $FFFA;
}

# Output bancato (32 x 16 KB) gestito da tools/pack_rom.py quando
# tutti i banchi avranno segmenti reali.
