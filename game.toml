# game.toml - configurazione del recompiler per il TUO gioco.
# Parti vuoto (NROM) e aggiungi direttive man mano che il gioco si blocca/crasha.
# Schema completo: nesrecomp/recompiler/src/game_config.c

[game]
output_prefix = "justbreed"          # -> generated/justbreed_full.c, generated/justbreed_dispatch.c
# disable_ptr_scan = true         # spegne lo scanner di tabelle di puntatori (se genera falsi positivi)
# deduplicate_functions = true    # condivide funzioni identiche tra banchi (giochi banked grandi)

# --- Mapper con banchi (MMC1/MMC3): indirizzo della routine che cambia banco PRG ---
# [mapper]
# bank_switch = [0xCC1A]

# --- Trampolino: JSR addr seguito da N byte inline (banco, lo, hi) ---
# [[trampoline]]
# addr = 0xF859
# inline_bytes = 3
# bs_fn_addr = 0xCC1A

# --- Tabelle di dispatch note: coppie LE16 contenenti (target-1) per RTS-dispatch ---
# [[known_table]]
# bank = 14
# start = 0x8087
# end = 0x8151

# --- Tabelle "split": byte bassi e alti in array separati ---
# [[split_table]]
# bank = 12
# lo_addr = 0x827B
# hi_addr = 0x8293
# count = 24
# stride = 1

# --- Funzioni raggiunte solo dinamicamente (il BFS statico non le vede) ---
# [functions]
# fixed = [0xC0A0]
# bank5 = [0x828E]

# --- Escludi dati dallo scanner di puntatori ---
# [[data_region]]
# bank = 3
# start = 0x9000
# end = 0x9200

# --- Salta un JSR (routine che manipola lo stack, incompatibile col recomp) ---
# [[nop_jsr]]
# addr = 0xC123
