group = "Gruppo"
default_enabled = false

[[feature]]
id = "mp_p2"
name = "Magia massima (compagno)"
description = "Mantiene la magia del compagno al massimo."
group = "Gruppo"
default_enabled = false

[[feature]]
id = "hp_p3"
name = "Salute massima (spadaccino/arciere 1)"
description = "Mantiene la salute del membro 1 al massimo."
group = "Gruppo"
default_enabled = false

[[feature]]
id = "mp_p3"
name = "Magia massima (spadaccino/arciere 1)"
description = "Mantiene la magia del membro 1 al massimo."
group = "Gruppo"
default_enabled = false

