# ---- Nemici ----
[[feature]]
id = "enemies_no_hp"
name = "Nemici senza salute"
description = "Azzera la salute di tutti i nemici: cadono al primo colpo."
group = "Nemici"
default_enabled = false

# ---- Audio ----
[[feature]]
id = "dpcm_popreduce"
name = "Riduzione del pop DPCM"
description = "Codice Game Genie SZVIZESE: evita il click del campione DPCM."
group = "Audio"
default_enabled = false

