format_version = 1
id = "justbreed.cheats"
version = "1.0.0"
name = "Just Breed - Cheat"
author = "JustBreed_NES_Recomp"
description = "Cheat classici per Just Breed (codici RAM e Game Genie), attivabili dal launcher."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

# Identita' ROM = CRC32 del banco fisso 62 (vedi cheats.c): vale per Just Breed giapponese, per la traduzione
# italiana e per la patch inglese di Stealth (che il runtime normalizza a questo valore).
[[target]]
game_id = "just-breed"
rom_crc32 = "a77ee1ce"

# ---- Esperienza ----
[[feature]]
id = "exp_lots"
name = "Molta EXP a fine battaglia"
description = "Ogni battaglia assegna moltissima esperienza (byte basso a 255)."
group = "Esperienza"
exclusive_group = "exp"
default_enabled = false

[[feature]]
id = "exp_max"
name = "EXP al massimo a fine battaglia"
description = "Ogni battaglia assegna il massimo dell'esperienza (255 + 255*256)."
group = "Esperienza"
exclusive_group = "exp"
default_enabled = false

# ---- Oro ----
[[feature]]
id = "gold_lots"
name = "Molto oro a fine battaglia"
description = "Ogni battaglia assegna molto oro (byte basso a 255)."
group = "Oro"
exclusive_group = "gold"
default_enabled = false

[[feature]]
id = "gold_max"
name = "Oro al massimo a fine battaglia"
description = "Ogni battaglia assegna il massimo dell'oro (255 + 255*256)."
group = "Oro"
exclusive_group = "gold"
default_enabled = false

# ---- Salute e magia del gruppo ----
[[feature]]
id = "hp_hero"
name = "Salute massima (eroe)"
description = "Mantiene la salute dell'eroe al massimo."
group = "Gruppo"
default_enabled = false

[[feature]]
